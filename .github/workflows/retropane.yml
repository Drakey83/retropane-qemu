# Builds qemu-system-arm with the RetroPane `x51v` machine for Linux and
# Windows, so RetroPane contributors never have to build QEMU themselves.
# Tagged pushes (rp-v*) publish a GitHub Release that retropane-os downloads.
name: RetroPane emulator

on:
  push:
    branches: [retropane]
    tags: ['rp-v*']
  pull_request:
    branches: [retropane]
  workflow_dispatch:

env:
  CONFIGURE_FLAGS: >-
    --target-list=arm-softmmu --disable-docs --disable-werror
    --disable-tools --disable-guest-agent --enable-sdl

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev libsdl2-dev libslirp-dev
      - name: Configure and build
        run: |
          mkdir build && cd build
          ../configure $CONFIGURE_FLAGS --enable-slirp
          make -j"$(nproc)" qemu-system-arm
      - name: Smoke test
        run: build/qemu-system-arm -M help | grep -q '^x51v '
      - name: Package
        run: |
          mkdir -p dist/retropane-qemu-linux-x86_64
          cp build/qemu-system-arm dist/retropane-qemu-linux-x86_64/
          strip dist/retropane-qemu-linux-x86_64/qemu-system-arm
          tar -C dist -czf retropane-qemu-linux-x86_64.tar.gz retropane-qemu-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: retropane-qemu-linux-x86_64
          path: retropane-qemu-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make bison flex diffutils
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-distlib
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-pip
      - name: Configure and build
        run: |
          mkdir build && cd build
          ../configure $CONFIGURE_FLAGS --enable-slirp
          make -j"$(nproc)" qemu-system-arm.exe
      - name: Smoke test
        run: build/qemu-system-arm.exe -M help | grep -q '^x51v '
      - name: Package (exe + the DLLs it needs)
        run: |
          out=dist/retropane-qemu-windows-x86_64
          mkdir -p "$out"
          cp build/qemu-system-arm.exe "$out/"
          strip "$out/qemu-system-arm.exe"
          ldd build/qemu-system-arm.exe | awk '/ucrt64/ {print $3}' | xargs -r -I{} cp {} "$out/"
          (cd dist && zip -qr ../retropane-qemu-windows-x86_64.zip retropane-qemu-windows-x86_64)
      - uses: actions/upload-artifact@v4
        with:
          name: retropane-qemu-windows-x86_64
          path: retropane-qemu-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/rp-v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "RetroPane emulator $GITHUB_REF_NAME" \
            --notes "QEMU 9.1 with the RetroPane x51v machine. Built by CI." \
            retropane-qemu-linux-x86_64.tar.gz retropane-qemu-windows-x86_64.zip
